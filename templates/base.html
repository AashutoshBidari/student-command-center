<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Student Command Center{% endblock %}</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="app-container">

        <aside class="sidebar">

            <h2 class="logo">STUDENT <span>COMMAND </span><span>CENTER</span></h2>

            <p class="menu-label">MENU</p>

            <nav>
                <a href="{{ url_for('dashboard') }}">Dashboard</a>
                <a href="{{ url_for('tasks') }}">Tasks</a>
                <a href="{{ url_for('subjects') }}">Subjects</a>
                <a href="{{ url_for('timetable') }}">Timetable</a>
                <a href="{{ url_for('attendance') }}">Attendance</a>
                <a href="{{ url_for('exams') }}">Exams</a>
            </nav>

            <div class="sidebar-bottom">
                <p>Student Command Center</p>
                <small>Your college life, organized.</small>
            </div>

        </aside>

        <main class="main-content">

            <header class="topbar">
                <h3>My Workspace</h3>
                <span>Personal Student Portal</span>
            </header>

            <section class="page-content">
                {% block content %}
                {% endblock %}
            </section>

        </main>

    </div>

</body>

</html>
